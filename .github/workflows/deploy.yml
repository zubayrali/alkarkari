# GitHub Pages is published from the VPS publisher hook (gh-pages branch).
# This workflow is a manual fallback for code-only rebuilds from the repo.
# Prefer: PUBLISHER_DEPLOY_TARGET=github-pages on the VPS.
#
# To use VPS deploys as primary:
#   Repo Settings → Pages → Deploy from a branch → gh-pages / (root)
# and leave this workflow for emergencies only (workflow_dispatch).

name: Deploy to GitHub Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.locales.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: locales
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('affine/locales.config.json', 'utf8'));
          const locales = config.locales.map((locale) => locale.code);
          process.stdout.write(`value=${JSON.stringify(locales)}\n`);
          EOF

  build:
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: ${{ fromJSON(needs.configure.outputs.locales) }}
    env:
      SITE_LANGUAGE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AFFiNE snapshots must already be present under affine/<locale>/ for this
      # fallback path. The VPS publisher is the primary content pipeline.
      - run: pnpm types:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ matrix.locale }}

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.locale }}
          path: out

  stitch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: artifacts
      - run: node scripts/stitch-deploy.ts
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: stitch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
